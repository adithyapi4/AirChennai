<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | AirChennai</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #fff8dc 0%, #fffdf5 55%, #fff1b8 100%);
            color: #292524;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 410px;
            padding: 36px;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #f5df82;
            box-shadow: 0 16px 40px rgba(161, 98, 7, 0.13);
        }

        .brand {
            margin-bottom: 30px;
            text-align: center;
        }

        .brand-name {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #854d0e;
        }

        .brand-label {
            margin-top: 8px;
            color: #78716c;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h2 {
            margin-bottom: 8px;
            font-size: 22px;
        }

        .subtitle {
            margin-top: 0;
            margin-bottom: 26px;
            color: #78716c;
            font-size: 14px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #e7d38b;
            border-radius: 8px;
            background: #fffef8;
            color: #292524;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: 2px solid #facc15;
            border-color: #ca8a04;
        }

        .sign-in-button {
            width: 100%;
            margin-top: 26px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #eab308;
            color: #292524;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .sign-in-button:hover {
            background: #facc15;
        }

        .forgot-password-container {
            margin-top: 14px;
            text-align: center;
        }

        .forgot-password-button {
            display: inline-block;
            padding: 10px 16px;
            border: 1px solid #e7c84b;
            border-radius: 8px;
            color: #854d0e;
            background: #fffdf5;
            font-size: 14px;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-password-button:hover {
            background: #fff4bf;
        }

        .message {
            margin-top: 16px;
            padding: 11px;
            border-radius: 7px;
            font-size: 13px;
        }

        .error {
            color: #991b1b;
            background: #fee2e2;
        }

        .success {
            color: #166534;
            background: #dcfce7;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            color: #78716c;
            font-size: 12px;
        }

        .login-card.wide {
            max-width: 480px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        input.invalid,
        select.invalid {
            border-color: #991b1b;
            background: #fff7f7;
        }

        .field-error {
            margin-top: 6px;
            color: #991b1b;
            font-size: 13px;
        }

        .signup-note {
            margin-top: 26px;
            padding-top: 20px;
            border-top: 1px solid #f5df82;
            text-align: center;
            color: #78716c;
            font-size: 14px;
        }

        .signup-note .forgot-password-container {
            margin-top: 12px;
        }

        @media (max-width: 480px) {
            .row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<main class="login-card wide">
    <header class="brand">
        <h1 class="brand-name">AirChennai</h1>
        <div class="brand-label">Customer Portal</div>
    </header>

    <h2>Create your account</h2>
    <p class="subtitle">Enter your details exactly as they appear on your ID.</p>

    <form th:action="@{/customer/register}" th:object="${registrationForm}" method="post" novalidate>
        <div class="row">
            <div>
                <label for="firstName">First name</label>
                <input
                    type="text"
                    id="firstName"
                    th:field="*{firstName}"
                    th:errorclass="invalid"
                    placeholder="First name"
                    autocomplete="given-name"
                    autofocus>
                <div class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
            </div>
            <div>
                <label for="lastName">Last name</label>
                <input
                    type="text"
                    id="lastName"
                    th:field="*{lastName}"
                    th:errorclass="invalid"
                    placeholder="Last name"
                    autocomplete="family-name">
                <div class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
            </div>
        </div>

        <div class="row">
            <div>
                <label for="dateOfBirth">Date of birth</label>
                <input
                    type="date"
                    id="dateOfBirth"
                    th:field="*{dateOfBirth}"
                    th:errorclass="invalid"
                    autocomplete="bday">
                <div class="field-error" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>
            </div>
            <div>
                <label for="gender">Gender</label>
                <select id="gender" th:field="*{gender}" th:errorclass="invalid">
                    <option value="">Select gender</option>
                    <option value="M">Male</option>
                    <option value="F">Female</option>
                </select>
                <div class="field-error" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
            </div>
        </div>

        <label for="phone">Phone number</label>
        <input
            type="tel"
            id="phone"
            th:field="*{phone}"
            th:errorclass="invalid"
            placeholder="10-digit phone number"
            inputmode="numeric"
            pattern="[0-9]{10}"
            minlength="10"
            maxlength="10"
            autocomplete="tel-national">
        <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>

        <label for="passengerType">Passenger type</label>
        <select id="passengerType" th:field="*{passengerType}" th:errorclass="invalid">
            <option value="">Select passenger type</option>
            <option value="ADULT">Adult</option>
            <option value="CHILD">Child</option>
            <option value="INFANT">Infant</option>
        </select>
        <div class="field-error" th:if="${#fields.hasErrors('passengerType')}" th:errors="*{passengerType}"></div>

        <label for="nationality">Nationality</label>
        <input
            type="text"
            id="nationality"
            th:field="*{nationality}"
            th:errorclass="invalid"
            placeholder="Enter your nationality"
            autocomplete="country-name">
        <div class="field-error" th:if="${#fields.hasErrors('nationality')}" th:errors="*{nationality}"></div>

        <label for="aadharNumber">Aadhar number</label>
        <input
            type="text"
            id="aadharNumber"
            th:field="*{aadharNumber}"
            th:errorclass="invalid"
            placeholder="12-digit Aadhar number"
            inputmode="numeric"
            pattern="[0-9]{12}"
            maxlength="12"
            autocomplete="off">
        <div class="field-error" th:if="${#fields.hasErrors('aadharNumber')}" th:errors="*{aadharNumber}"></div>

        <button type="submit" class="sign-in-button">Create account</button>
    </form>

    <div class="signup-note">
        Already have an account?
        <div class="forgot-password-container">
            <a th:href="@{/customer/login}"
               class="forgot-password-button">
                Sign in
            </a>
        </div>
    </div>

    <footer class="footer">
        AirChennai Reservations
    </footer>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Login | AirChennai</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: linear-gradient(135deg, #fff8dc 0%, #fffdf5 55%, #fff1b8 100%);
            color: #292524;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 410px;
            padding: 36px;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #f5df82;
            box-shadow: 0 16px 40px rgba(161, 98, 7, 0.13);
        }

        .brand {
            margin-bottom: 30px;
            text-align: center;
        }

        .brand-name {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #854d0e;
        }

        .brand-label {
            margin-top: 8px;
            color: #78716c;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h2 {
            margin-bottom: 8px;
            font-size: 22px;
        }

        .subtitle {
            margin-top: 0;
            margin-bottom: 26px;
            color: #78716c;
            font-size: 14px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #e7d38b;
            border-radius: 8px;
            background: #fffef8;
            color: #292524;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #facc15;
            border-color: #ca8a04;
        }

        .sign-in-button {
            width: 100%;
            margin-top: 26px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #eab308;
            color: #292524;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .sign-in-button:hover {
            background: #facc15;
        }

        .forgot-password-container {
            margin-top: 14px;
            text-align: center;
        }

        .forgot-password-button {
            display: inline-block;
            padding: 10px 16px;
            border: 1px solid #e7c84b;
            border-radius: 8px;
            color: #854d0e;
            background: #fffdf5;
            font-size: 14px;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-password-button:hover {
            background: #fff4bf;
        }

        .message {
            margin-top: 16px;
            padding: 11px;
            border-radius: 7px;
            font-size: 13px;
        }

        .error {
            color: #991b1b;
            background: #fee2e2;
        }

        .success {
            color: #166534;
            background: #dcfce7;
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            color: #78716c;
            font-size: 12px;
        }
    </style>
</head>

<body>
<main class="login-card">
    <header class="brand">
        <h1 class="brand-name">AirChennai</h1>
        <div class="brand-label">Employee Portal</div>
    </header>

    <h2>Welcome back</h2>

    <div class="message error" th:if="${param.error}">
        Invalid employee ID or password, or your account cannot sign in.
        Please try again.
    </div>

    <div class="message success" th:if="${param.logout}">
        You have been signed out successfully.
    </div>

    <form th:action="@{/employee/login}" method="post">
        <label for="employeeId">Employee ID</label>
        <input
            type="text"
            id="employeeId"
            name="employeeId"
            placeholder="Enter your employee ID"
            autocomplete="username"
            required
            autofocus>

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>

        <button type="submit" class="sign-in-button">Sign in</button>
    </form>

    <div class="forgot-password-container">
        <a th:href="@{/employee/forgot-password}"
           class="forgot-password-button">
            Forgot Password?
        </a>
    </div>

    <footer class="footer">
        AirChennai Internal Systems
    </footer>
</main>
</body>
</html>


<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <style th:fragment="styles">
        .employee-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 6%;
            background: #ffcc00;
        }

        .employee-header .brand {
            color: #292929;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
            white-space: nowrap;
        }

        .employee-header .header-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
        }

        .employee-header .welcome {
            font-size: 15px;
            font-weight: bold;
            white-space: nowrap;
        }

        .employee-header .home-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border: 1px solid #292929;
            border-radius: 6px;
            color: #292929;
            text-decoration: none;
        }

        .employee-header .home-button svg {
            width: 21px;
            height: 21px;
        }

        .employee-header .home-button:hover {
            background: #292929;
            color: white;
        }

        .employee-header .logout-button {
            padding: 9px 16px;
            border: 1px solid #292929;
            border-radius: 6px;
            background: transparent;
            color: #292929;
            font-size: 14px;
            cursor: pointer;
        }

        .employee-header .logout-button:hover {
            background: #292929;
            color: white;
        }

        @media (max-width: 480px) {
            .employee-header {
                padding: 14px 4%;
                gap: 8px;
            }

            .employee-header .brand {
                font-size: 18px;
            }

            .employee-header .header-right {
                gap: 7px;
            }

            .employee-header .welcome {
                font-size: 13px;
            }

            .employee-header .logout-button {
                padding: 8px 10px;
            }
        }
    </style>
</head>

<body>

<header th:fragment="header" class="employee-header">

    <a class="brand"
       th:href="@{${employeeDashboardUrl}}">
        ✈ AirChennai
    </a>

    <div class="header-right">

        <span class="welcome"
              th:text="|Hi ${employeeFirstName}|">
            Hi Employee
        </span>

        <a th:if="${showHomeButton}"
           class="home-button"
           th:href="@{${employeeDashboardUrl}}"
           aria-label="Home"
           title="Dashboard">

            <svg xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 aria-hidden="true">
                <path d="m3 10 9-7 9 7"/>
                <path d="M5 9v12h14V9"/>
                <path d="M9 21v-7h6v7"/>
            </svg>
        </a>

        <form th:action="@{/employee/logout}" method="post">
            <button type="submit" class="logout-button">
                Logout
            </button>
        </form>

    </div>

</header>

</body>
</html>

spring.application.name=AirChennai

# PostgreSQL connection for normal application operations
spring.datasource.url=jdbc:postgresql://localhost:5433/airchennai
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway database migrations
spring.flyway.enabled=true
spring.flyway.user=${DB_MIGRATION_USER}
spring.flyway.password=${DB_MIGRATION_PASSWORD}
spring.flyway.default-schema=public
spring.flyway.locations=classpath:db/migration

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
